[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "axoldb-example-deap-knapsack"
version = "1.0.0"
requires-python = ">=3.12,<3.15"
dependencies = ["deap==1.4.4", "numpy==2.5.3", "matplotlib==3.11.2"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/deap_axol"]

[tool.pytest.ini_options]
testpaths = ["tests"]
